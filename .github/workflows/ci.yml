# Tests, lints and scans every change. Runs standalone on pull requests and on pushes to any branch
# but master, and is also called by deploy.yml (workflow_call) so a push to master runs it exactly once,
# as the gate in front of the build and deploy jobs.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q

      - name: Shellcheck
        run: find deploy -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Scan git history for secrets (tracked history only, never untracked files like logs/)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact
