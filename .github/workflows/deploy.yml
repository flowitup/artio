# Pushing to main tests, builds ghcr.io/flowitup/artio and deploys the exact resulting digest to
# folio-prod-1 through the forced-command SSH key, then relies on deploy.sh's own health check
# (version + live worker loops) with automatic rollback. See docs/deployment-guide.md.
#
# A workflow_dispatch from a branch other than main runs the `test` job's `if` to false; since
# `build` and `deploy` both depend on it transitively, the whole pipeline no-ops.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency: {group: deploy-artio, cancel-in-progress: false}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml   # its job sets its own timeout; a calling job may not
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      # Pinned by digest (moby/buildkit, tag buildx-stable-1 at lookup time), not the mutable tag
      # setup-buildx-action defaults to, so the builder itself is supply-chain pinned like everything
      # else in this pipeline.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .   # the local, already-checked-out tree: a git-context build can ignore .dockerignore
          push: true
          tags: ghcr.io/flowitup/artio:${{ github.sha }},ghcr.io/flowitup/artio:latest
          build-args: ARTIO_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {packages: read}
    steps:
      - name: Deploy through the restricted key
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KEY: ${{ secrets.ARTIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad sha or digest"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/artio_deploy && chmod 600 ~/.ssh/artio_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$GITHUB_ACTOR" | ssh -i ~/.ssh/artio_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 "root@$HOST" "deploy $SHA $DIGEST"

  # Tags the deployed commit v<version> (pyproject.toml) and publishes a GitHub release with notes
  # generated from the merged PRs, but only the first time that version reaches production: bump the
  # version (pyproject.toml, uv.lock, artio/__init__.py) in a PR to cut the next release.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $version"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do"
            exit 0
          fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Artio v$version" --generate-notes --latest
