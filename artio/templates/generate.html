{% extends "base.html" %}
{% block title %}Generate &middot; Artio{% endblock %}
{% block content %}
<h1>Generate</h1>
{% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/generate" class="narrow-form">
  <label for="model_id">Model</label>
  <select id="model_id" name="model_id" hx-get="/generate/params" hx-target="#gen-params" hx-swap="innerHTML"
          hx-trigger="change">
    {% for m in models %}
    <option value="{{ m.id }}" {% if m.id == (values.model_id or model.id) %}selected{% endif %}>{{ m.label }}</option>
    {% endfor %}
  </select>

  <label for="prompt">Prompt</label>
  <textarea id="prompt" name="prompt" required>{{ values.prompt or '' }}</textarea>

  <label for="negative">Negative prompt</label>
  <textarea id="negative" name="negative">{{ values.negative or '' }}</textarea>

  <div id="gen-params">
    {% include "partials/gen_params.html" %}
  </div>

  <label for="count">Count</label>
  <input type="number" id="count" name="count" min="1" max="8" value="{{ values.count or 1 }}">

  <button type="submit" class="auto">Generate</button>

  <fieldset role="group">
    <input type="text" name="preset_name" placeholder="Preset name" aria-label="Preset name">
    <button type="button" hx-post="/presets" hx-target="#preset-status" hx-swap="innerHTML">
      Save as preset
    </button>
  </fieldset>
  <div id="preset-status"></div>
</form>
<p><a href="/library">Saved presets</a></p>
{% endblock %}
